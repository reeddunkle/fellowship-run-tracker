packages:
  - "apps/*"
  - "packages/*"
  - "tools/*"

# Electron Forge (used to package apps/electron) can't resolve dependencies
# through pnpm's default symlinked node_modules structure.
# https://www.electronforge.io/
nodeLinker: hoisted

minimumReleaseAge: 10080 # Minutes -- (7 days)
minimumReleaseAgeExclude:
  - "@biomejs/*"
  - '@effect/tsgo*'
  - "@types/node"
  - "tsx"

overrides:
  # @electron-forge 7.x pins @electron/rebuild@^3, which depends on a git-hosted
  # fork (@electron/node-gyp) that blockExoticSubdeps rejects. v4 uses upstream
  # node-gyp from npm and keeps the same `rebuild()` API Forge calls.
  # Remove once Forge 8 (which depends on @electron/rebuild@^4) is stable.
  '@electron/rebuild': '^4.2.0'

  # @effect/platform-node depends on @effect/platform-node-shared via a caret
  # range (e.g. ^4.0.0-beta.107), which semver lets resolve to a newer rc that
  # requires a newer `effect` than the catalog's. Keep it on the catalog version.
  '@effect/platform-node-shared': 'catalog:effect'

allowBuilds:
  '@playwright/browser-chromium': true # Playwright uses for browser tests
  esbuild: true # Vite/tsx use for builds
  msgpackr-extract: false # Effect dependency via msgpackr
  puppeteer: true # Mermaid uses for rendering

catalogs:
  biome:
    "@biomejs/biome": "2.3.4"
  effect:
    # Match versions
    "@effect/platform-node": "4.0.0-beta.107"
    "@effect/platform-node-shared": "4.0.0-beta.107"
    "@effect/sql-sqlite-node": "4.0.0-beta.107"
    "effect": "4.0.0-beta.107"

    # Match versions
    "@effect/tsgo": 0.45.0
    "@effect/tsgo-win32-x64": "0.45.0"
  electron:
    "electron": "^44.3.0"
    "@electron/fuses": "^1.8.0"

    # Match versions
    "@electron-forge/cli": "^7.10.2"
    "@electron-forge/maker-zip": "^7.10.2"
    "@electron-forge/plugin-auto-unpack-natives": "^7.10.2"
    "@electron-forge/plugin-fuses": "^7.10.2"
  mermaid:
    "@mermaid-js/mermaid-cli": "^11.17.0"
  node:
    "@types/node": ^24.13.6
  prettier:
    "prettier-plugin-embed": "^0.5.1"
    "prettier-plugin-sql": "^0.20.0"
    "prettier": "^3.9.6"
  react:
    "@types/react": "^19.2.18"
    "@types/react-dom": "^19.2.5"
    "react": "^19.2.8"
    "react-dom": "^19.2.8"
  state-management:
    "zustand": "^5.0.15"
  runtime:
    "env-paths": 4.0.0
  tailwind:
    "@tailwindcss/vite": "^4.3.3"
    "class-variance-authority": "^0.7.1"
    "clsx": "^2.1.1"
    "tailwindcss": "^4.3.3"
    "tailwind-merge": "^3.6.0"
    "tw-animate-css": "^1.4.0"
  tanstack:
    "@tanstack/react-form": "^1.33.5"
    "@tanstack/react-query": "^5.102.8"
    "@tanstack/react-router": "^1.170.32"
    "@tanstack/react-table": "^9.2.4"
    "@tanstack/router-plugin": "^1.168.35"
  testing:
    # Match versions
    "@playwright/browser-chromium": "1.63.0"
    "playwright": "1.63.0"

    # Match versions
    "@vitest/browser-playwright": "5.0.0"
    "vitest": "5.0.0"

    "vitest-browser-react": "^2.2.0"
  tooling:
    "@oxlint/plugins": ^1.83.0
    "@vercel/nft": "1.11.0"
    "jsonc-parser": ^3.3.1
    "knip": ^6.35.0
    "npm-run-all2": ^9.0.3
    "oxlint": ^1.83.0
    "wait-on": "^9.1.0"
  typescript:
    "tsx": ^4.23.13
    "typescript": ^7.0.2
  ui:
    "@base-ui/react": "^1.8.0"
    "@fontsource-variable/geist": "^5.3.0"
    "lucide-react": "^1.43.0"
    "shadcn": "^4.20.0"
  validation:
    "@standard-schema/spec": "^1.1.0"
  vite:
    "@vitejs/plugin-react": "^6.1.1"
    "vite": "^8.2.2"
  util:
    "date-fns": "^4.4.0"
